name: Keep Supabase awake

# Supabase pauses free projects after about a week with no activity, which
# makes the portfolio stop loading projects. This job makes a tiny read
# request every 3 days so the project always counts as active.
# It only sends a read-only request with the PUBLIC anon key (the same key
# that is already in js/config.js). No secrets are needed.

on:
  schedule:
    - cron: "17 6 */3 * *"   # every 3 days at 06:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://ixubjyxegefvpgdickac.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4dWJqeXhlZ2VmdnBnZGlja2FjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NzU0NjMsImV4cCI6MjEwNTA1MTQ2M30.q60T03z8fR74dDNKA1JlsmTAESUQ8S858XGu82wGabQ
        run: |
          # --fail makes the job go red (and GitHub emails you) if Supabase
          # is paused or unreachable, so you find out early.
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1"
          echo
          echo "Supabase responded OK."
